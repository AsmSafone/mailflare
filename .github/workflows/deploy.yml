name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply remote D1 database migrations"
        type: boolean
        default: true
      cf_token:
        description: "(Optional) Runtime CF_TOKEN if overriding secret"
        required: false
        type: string
      cloudflare_api_token:
        description: "(Optional) Cloudflare API Token if overriding secret"
        required: false
        type: string
      cloudflare_account_id:
        description: "(Optional) Cloudflare Account ID (auto-resolved if omitted)"
        required: false
        type: string
  push:
    branches:
      - main
      - master

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare_api_token || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id || secrets.CLOUDFLARE_ACCOUNT_ID }}
      RUNTIME_CF_TOKEN: ${{ inputs.cf_token || secrets.CF_TOKEN || inputs.cloudflare_api_token || secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      GITHUB_UPDATE_TOKEN: ${{ secrets.GITHUB_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
      APPLY_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations || 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Verify Cloudflare API Token & Auto-resolve Account ID
        run: |
          node -e '
          async function verifyAndResolve() {
            const rawToken = process.env.CLOUDFLARE_API_TOKEN || "";
            const token = rawToken.trim().replace(/^Bearer\s+/i, "");

            if (!token) {
              console.error("::error::Missing CLOUDFLARE_API_TOKEN. Add it to GitHub repository secrets (Settings -> Secrets and variables -> Actions).");
              console.error("\n=================================================================");
              console.error("❌ REQUIRED SECRET NOT FOUND: CLOUDFLARE_API_TOKEN");
              console.error("1. Go to repository Settings -> Secrets and variables -> Actions");
              console.error("2. Add secret CLOUDFLARE_API_TOKEN (Cloudflare API Token with Workers, D1, R2, Queues, DNS, and Email Routing permissions)");
              console.error("=================================================================\n");
              process.exit(1);
            }

            // 1. Verify token status
            console.log("🔑 Verifying Cloudflare API Token...");
            let verifyData = null;
            try {
              const verifyRes = await fetch("https://api.cloudflare.com/client/v4/user/tokens/verify", {
                headers: { Authorization: `Bearer ${token}` }
              });
              verifyData = await verifyRes.json();

              if (!verifyRes.ok || !verifyData.success || verifyData.result?.status !== "active") {
                const errMsg = verifyData?.errors?.map(e => `[Code ${e.code}] ${e.message}`).join("; ") || verifyRes.statusText || "Token verification failed";
                console.error("::error::Cloudflare API Token verification failed: " + errMsg);
                console.error("\n=================================================================");
                console.error("❌ CLOUDFLARE API TOKEN IS INVALID OR INACTIVE");
                console.error("HTTP Status: " + verifyRes.status + " (" + verifyRes.statusText + ")");
                console.error("API Response: " + errMsg);
                console.error("\nPlease check the following:");
                console.error("1. Make sure CLOUDFLARE_API_TOKEN contains only the token secret, without \"Bearer \" prefix.");
                console.error("2. Check that the token has not expired and has not been revoked in the Cloudflare dashboard.");
                console.error("3. If you configured \"Client IP Address Filtering\" on the token, remove it or ensure it allows GitHub Actions runners.");
                console.error("=================================================================\n");
                process.exit(1);
              }

              console.log(`✅ Cloudflare API Token is valid and active! (Token ID: ${verifyData.result.id})`);
            } catch (err) {
              console.error("::error::Network error while verifying Cloudflare API token: " + err.message);
              process.exit(1);
            }

            // 2. Resolve Account ID
            let accountId = (process.env.CLOUDFLARE_ACCOUNT_ID || "").trim();
            let accountName = "";

            if (accountId) {
              console.log(`Using explicitly configured Account ID: ${accountId}`);
            } else {
              console.log("🔍 Auto-detecting Cloudflare Account ID...");
              // Try GET /accounts
              try {
                const accRes = await fetch("https://api.cloudflare.com/client/v4/accounts", {
                  headers: { Authorization: `Bearer ${token}` }
                });
                if (accRes.ok) {
                  const accData = await accRes.json();
                  if (accData.success && Array.isArray(accData.result) && accData.result.length > 0) {
                    accountId = accData.result[0].id;
                    accountName = accData.result[0].name || "";
                  }
                }
              } catch {}

              // Try GET /zones fallback
              if (!accountId) {
                try {
                  const zoneRes = await fetch("https://api.cloudflare.com/client/v4/zones", {
                    headers: { Authorization: `Bearer ${token}` }
                  });
                  if (zoneRes.ok) {
                    const zoneData = await zoneRes.json();
                    if (zoneData.success && Array.isArray(zoneData.result) && zoneData.result[0]?.account?.id) {
                      accountId = zoneData.result[0].account.id;
                      accountName = zoneData.result[0].account.name || "";
                    }
                  }
                } catch {}
              }
            }

            if (accountId) {
              console.log(`✅ Target Cloudflare Account: ${accountName ? accountName + " " : ""}(${accountId})`);
              const fs = await import("node:fs");
              if (process.env.GITHUB_ENV) {
                fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ACCOUNT_ID=${accountId}\n`);
              }
            } else {
              console.warn("::warning::Could not automatically detect Account ID from token. Wrangler will attempt discovery during deploy. If it fails, add CLOUDFLARE_ACCOUNT_ID to GitHub secrets.");
            }
          }

          verifyAndResolve().catch((err) => {
            console.error("::error::Unexpected error: " + err.message);
            process.exit(1);
          });
          '

      - name: Install dependencies
        run: npm ci

      - name: Provision Cloudflare Resources (D1, R2, Queues)
        run: node scripts/setup-cloudflare.mjs

      - name: Build Application Bundle
        run: |
          npm run db:bundle
          npx opennextjs-cloudflare build

      - name: Deploy Worker to Cloudflare
        id: deploy
        run: |
          set -o pipefail
          OPEN_NEXT_DEPLOY=true npx wrangler deploy | tee deploy-output.txt

          WORKER_URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy-output.txt | head -n 1 || true)
          if [ -z "$WORKER_URL" ]; then
            WORKER_URL="https://mailflare.workers.dev"
          fi
          echo "worker_url=${WORKER_URL}" >> "$GITHUB_OUTPUT"

      - name: Configure Worker Secrets
        run: |
          set -euo pipefail
          echo "Setting runtime CF_TOKEN..."
          echo "${RUNTIME_CF_TOKEN}" | npx wrangler secret put CF_TOKEN

          if [ -n "${TURNSTILE_SECRET_KEY:-}" ]; then
            echo "Setting TURNSTILE_SECRET_KEY..."
            echo "${TURNSTILE_SECRET_KEY}" | npx wrangler secret put TURNSTILE_SECRET_KEY
          fi

          if [ -n "${GITHUB_UPDATE_TOKEN:-}" ]; then
            echo "Setting GITHUB_UPDATE_TOKEN..."
            echo "${GITHUB_UPDATE_TOKEN}" | npx wrangler secret put GITHUB_UPDATE_TOKEN
          fi

      - name: Apply Remote D1 Database Migrations
        if: env.APPLY_MIGRATIONS == 'true'
        run: |
          echo "Applying pending D1 database migrations..."
          npx wrangler d1 migrations apply DB --remote

      - name: Output Deployment Summary
        if: always()
        run: |
          WORKER_URL="${{ steps.deploy.outputs.worker_url || 'https://mailflare.workers.dev' }}"
          SETUP_URL="${WORKER_URL}/setup"

          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          # 🚀 Mailflare Deployment Summary

          Mailflare has been successfully built and deployed to Cloudflare Workers!

          ### 🔗 Deployed Application
          - **Worker URL:** [${WORKER_URL}](${WORKER_URL})
          - **Setup Wizard:** [${SETUP_URL}](${SETUP_URL})

          ### 📋 Complete Your Setup
          1. **Open Setup Wizard:** Visit [${SETUP_URL}](${SETUP_URL}) in your browser.
          2. **Create Admin Account:** Follow the on-screen prompt to create your initial administrator account.
          3. **Connect Your Domain:** Add your domain managed by the same Cloudflare account to automatically configure Email Routing and DNS records.
          4. **Create Mailbox:** Set up your primary inbox address and start sending and receiving emails!

          ---
          *Deployed via GitHub Actions without requiring local installation.*
          EOF
